<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="geo.region" content="ID-JK" />
  <meta name="geo.placename" content="Jakarta" />
  <meta name="geo.position" content="-6.2088,106.8456" />
  <meta name="ICBM" content="-6.2088,106.8456" />
  <title>Cuaca — Weather Report</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <div class="card">
      <header class="card-header">
        <div class="brand">
          <span class="brand-mark">◐</span>
          <div>
            <div class="brand-name">Cuaca</div>
            <div class="brand-tag">Laporan cuaca real-time</div>
          </div>
        </div>
      </header>

      <div class="card-body">
        <div class="search">
          <button id="geoBtn" type="button" title="Deteksi lokasi">
            <span class="geo-icon">📍</span>
            <span class="geo-label">Deteksi Lokasi Saya</span>
          </button>
        </div>

        <div id="loading" class="loader" role="status" aria-live="polite" style="display:none;">
          <div class="loader-bars">
            <div class="loader-bar"></div>
            <div class="loader-bar"></div>
            <div class="loader-bar"></div>
          </div>
          <p class="loader-text">Memuat data cuaca…</p>
        </div>

        <div id="error" class="alert" style="display:none;"></div>

        <div id="weatherCard" class="weather" style="display:none;">
          <div class="weather-head">
            <div class="weather-info">
              <h1 id="cityName"></h1>
              <p id="dateTime"></p>
              <p id="locationInfo" class="meta"></p>
            </div>
            <div class="weather-icon-large" id="weatherIcon"></div>
          </div>

          <div class="weather-main">
            <div class="temp">
              <span id="temperature">--</span><span class="unit">°C</span>
            </div>
            <p id="description" class="condition"></p>
          </div>

          <div class="details-grid">
            <div class="detail">
              <span class="detail-label">Kelembaban</span>
              <span class="detail-value" id="humidity">--</span>
            </div>
            <div class="detail">
              <span class="detail-label">Angin</span>
              <span class="detail-value" id="windSpeed">--</span>
            </div>
            <div class="detail">
              <span class="detail-label">Terasa seperti</span>
              <span class="detail-value" id="feelsLike">--</span>
            </div>
            <div class="detail">
              <span class="detail-label">Tekanan</span>
              <span class="detail-value" id="pressure">--</span>
            </div>
            <div class="detail">
              <span class="detail-label">Akurasi GPS</span>
              <span class="detail-value" id="gpsAccuracy">--</span>
            </div>
            <div class="detail">
              <span class="detail-label">Koordinat</span>
              <span class="detail-value" id="coordinates" style="font-size:0.75rem;">--</span>
            </div>
          </div>

          <div class="forecast">
            <h2 class="section-title">Prakiraan 7 Hari</h2>
            <div id="forecastList" class="forecast-list"></div>
          </div>
        </div>
      </div>

      <footer class="card-footer">
        <p class="footer-text">Data dari <a href="https://open-meteo.com" target="_blank">Open-Meteo API</a></p>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
